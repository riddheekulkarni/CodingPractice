<!DOCTYPE html>
<html>
    <head>
        <title>form</title>
    </head>
    <body>
        <h1>Your Course Landing Page</h1>
        <form action="http:\\www.google.com">
            <p><label for="title">Course title</label>
            <input type="text" id="title" name="coursetitle" required></p>
            <p><label for="description">Course description</label></p>
            <p><textarea rows="10" cols="30" id="description"></textarea></p>
            <p><label for="level">Skill Level</label>
            <select name="level" id="level">
                <option value="beginner level">Beginner Level</option>
                <option value="intermediate level">Intermediate Level</option>
                <option value="expert level">Expert Level</option>
                <option value="all levels">All levels</option>
            </select></p>
            <p><label for="ready">Ready to publish this course</label>
            <input type="checkbox" name="ready" id="ready"></p>
            <p><button>Submit</button></p>
        </form>
    </body>
</html>
